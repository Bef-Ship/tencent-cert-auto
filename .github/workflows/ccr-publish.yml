name: Publish to Tencent CCR

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Docker platforms"
        required: false
        default: "linux/amd64,linux/arm64"

env:
  # Override via repo Variables if needed (enterprise TCR host etc.)
  CCR_REGISTRY: ${{ vars.CCR_REGISTRY != '' && vars.CCR_REGISTRY || 'ccr.ccs.tencentyun.com' }}
  CCR_NAMESPACE: ${{ vars.CCR_NAMESPACE }}
  IMAGE_NAME: ${{ vars.CCR_IMAGE_NAME != '' && vars.CCR_IMAGE_NAME || 'tencent-cert-auto' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check CCR namespace
        run: |
          if [ -z "${{ env.CCR_NAMESPACE }}" ]; then
            echo "Missing repository Variable: CCR_NAMESPACE"
            echo "Set Settings → Secrets and variables → Actions → Variables → CCR_NAMESPACE"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Tencent CCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CCR_REGISTRY }}
          username: ${{ secrets.CCR_USERNAME }}
          password: ${{ secrets.CCR_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CCR_REGISTRY }}/${{ env.CCR_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
